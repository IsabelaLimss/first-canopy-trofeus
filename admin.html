<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#004f63">
<title>FIRST CANOPY — Exportar propostas</title>
<style>
:root{--teal:#004f63;--deep:#003b4e;--cream:#efd9a7;--paper:#fffaf1;--ink:#073f52;--muted:#71838a;--danger:#a9413b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--teal) url("assets/topography.svg") center/cover fixed no-repeat;color:var(--ink);display:grid;place-items:center;padding:24px}
.card{width:min(560px,100%);background:var(--paper);border-radius:24px;padding:34px;box-shadow:0 24px 70px rgba(0,30,40,.22)}
.brand{width:240px;max-width:70%;display:block;margin:0 auto 28px}.card h1{margin:0;text-align:center;font-size:30px}.card p{color:var(--muted);line-height:1.5;text-align:center}.card label{display:block;font-weight:750;margin:24px 0 8px}.card input{width:100%;height:52px;border:1.5px solid #d8d1c4;border-radius:11px;background:#fff;padding:0 14px;outline:none}.card input:focus{border-color:#0d6b82;box-shadow:0 0 0 3px rgba(13,107,130,.08)}button{width:100%;height:54px;border:0;border-radius:12px;background:var(--deep);color:#fff;font-weight:800;font-size:16px;margin-top:16px;cursor:pointer}.msg{min-height:22px;margin-top:12px;font-size:13px;text-align:center}.err{color:var(--danger)}.ok{color:#0c6a61}.back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--ink)}
</style>
</head>
<body>
<main class="card">
<img src="assets/first-canopy-logo.svg" class="brand" alt="FIRST CANOPY">
<h1>Exportar propostas</h1>
<p>Informe a chave administrativa para baixar a planilha CSV com todas as submissões registradas.</p>
<label for="token">Chave administrativa</label>
<input id="token" type="password" autocomplete="off" placeholder="Digite a chave">
<button id="download" type="button">Baixar planilha</button>
<div id="message" class="msg" aria-live="polite"></div>
<a class="back" href="/">Voltar ao formulário</a>
</main>
<script>
const btn=document.getElementById('download'),input=document.getElementById('token'),msg=document.getElementById('message');
btn.addEventListener('click',async()=>{
  const token=input.value.trim();
  if(!token){msg.className='msg err';msg.textContent='Informe a chave administrativa.';return}
  btn.disabled=true;btn.textContent='Gerando planilha...';msg.textContent='';
  try{
    const r=await fetch('/api/export.csv',{headers:{Authorization:'Bearer '+token}});
    if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.error||'Não foi possível gerar a planilha.')}
    const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='first-canopy-propostas.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    msg.className='msg ok';msg.textContent='Planilha gerada com sucesso.';
  }catch(e){msg.className='msg err';msg.textContent=e.message}
  finally{btn.disabled=false;btn.textContent='Baixar planilha'}
});
</script>
</body>
</html>
